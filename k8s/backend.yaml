apiVersion: apps/v1
kind: Deployment
metadata:
  name: vulnerax-backend
  namespace: vulnerax
  labels:
    app: vulnerax
    component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vulnerax
      component: backend
  template:
    metadata:
      labels:
        app: vulnerax
        component: backend
    spec:
      containers:
        - name: backend
          image: vulnerax/backend:latest
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: vulnerax-secrets
                  key: database-url
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: vulnerax-secrets
                  key: database-user
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vulnerax-secrets
                  key: database-password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: vulnerax-secrets
                  key: jwt-secret
            - name: REDIS_HOST
              value: vulnerax-redis
            - name: KAFKA_BOOTSTRAP
              value: vulnerax-kafka:9092
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: vulnerax-backend
  namespace: vulnerax
spec:
  selector:
    app: vulnerax
    component: backend
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vulnerax-ingress
  namespace: vulnerax
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - vulnerax.example.com
      secretName: vulnerax-tls
  rules:
    - host: vulnerax.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: vulnerax-backend
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vulnerax-frontend
                port:
                  number: 80
