apiVersion: apps/v1
kind: Deployment
metadata:
  name: vulnerax-frontend
  namespace: vulnerax
  labels:
    app: vulnerax
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vulnerax
      component: frontend
  template:
    metadata:
      labels:
        app: vulnerax
        component: frontend
    spec:
      containers:
        - name: frontend
          image: vulnerax/frontend:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: vulnerax-frontend
  namespace: vulnerax
spec:
  selector:
    app: vulnerax
    component: frontend
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
