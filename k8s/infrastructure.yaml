apiVersion: v1
kind: Namespace
metadata:
  name: vulnerax
  labels:
    app: vulnerax
---
apiVersion: v1
kind: Secret
metadata:
  name: vulnerax-secrets
  namespace: vulnerax
type: Opaque
stringData:
  database-url: jdbc:postgresql://vulnerax-postgres:5432/vulnerax
  database-user: vulnerax
  database-password: CHANGE_ME
  jwt-secret: CHANGE_ME_TO_64_CHARS_MINIMUM_FOR_HS512
  s3-access-key: minioadmin
  s3-secret-key: minioadmin
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vulnerax-config
  namespace: vulnerax
data:
  REDIS_HOST: vulnerax-redis
  KAFKA_BOOTSTRAP: vulnerax-kafka:9092
  CORS_ORIGINS: https://vulnerax.example.com
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vulnerax-postgres
  namespace: vulnerax
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vulnerax
      component: postgres
  template:
    metadata:
      labels:
        app: vulnerax
        component: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: vulnerax
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: vulnerax-secrets
                  key: database-user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vulnerax-secrets
                  key: database-password
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: vulnerax-postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: vulnerax-postgres
  namespace: vulnerax
spec:
  selector:
    app: vulnerax
    component: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vulnerax-postgres-pvc
  namespace: vulnerax
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vulnerax-redis
  namespace: vulnerax
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vulnerax
      component: redis
  template:
    metadata:
      labels:
        app: vulnerax
        component: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
---
apiVersion: v1
kind: Service
metadata:
  name: vulnerax-redis
  namespace: vulnerax
spec:
  selector:
    app: vulnerax
    component: redis
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: v1
kind: Secret
metadata:
  name: vulnerax-minio-secret
  namespace: vulnerax
type: Opaque
stringData:
  MINIO_ROOT_USER: minioadmin
  MINIO_ROOT_PASSWORD: minioadmin
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vulnerax-minio
  namespace: vulnerax
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vulnerax
      component: minio
  template:
    metadata:
      labels:
        app: vulnerax
        component: minio
    spec:
      containers:
        - name: minio
          image: minio/minio:latest
          command: ["minio", "server", "/data", "--console-address", ":9001"]
          ports:
            - containerPort: 9000
            - containerPort: 9001
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: vulnerax-minio-secret
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vulnerax-minio-secret
                  key: MINIO_ROOT_PASSWORD
          volumeMounts:
            - name: minio-data
              mountPath: /data
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "250m"
      volumes:
        - name: minio-data
          persistentVolumeClaim:
            claimName: vulnerax-minio-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vulnerax-minio-pvc
  namespace: vulnerax
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: vulnerax-minio
  namespace: vulnerax
spec:
  selector:
    app: vulnerax
    component: minio
  ports:
    - name: api
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vulnerax-network-policy
  namespace: vulnerax
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 80
  egress:
    - {} # Allow all egress for now
