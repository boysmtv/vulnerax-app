groups:
  - name: D:\Work\Pribadi\WebProject\vulnerax-app\monitoring_alerts
    interval: 30s
    rules:
      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High error rate detected"
          description: "Error rate is above 5% for {'$value'}"

      - alert: HighLatency
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 2
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High latency detected"
          description: "P95 latency is above 2s for {'$value'}"

      - alert: ServiceDown
        expr: up{job="D:\Work\Pribadi\WebProject\vulnerax-app\monitoring"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service {'$labels.job'} is down"
          description: "{'$labels.instance'} has been unreachable for more than 1 minute"
